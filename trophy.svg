<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 12; }
    .title { fill: #58a6ff; font-size: 22px; font-weight: bold; font-family: Arial, Helvetica, sans-serif; }
    .text { fill: #c9d1d9; font-size: 14px; font-family: Arial, Helvetica, sans-serif; }
    .trophy { font-size: 40px; }
  </style>

  <rect class="bg" width="100%" height="100%"/>

  <g transform="translate(40,30)">
    <rect class="card" width="260" height="110"/>
    <text x="20" y="45" class="trophy">🏆</text>
    <text x="70" y="45" class="title">Top Developer</text>
    <text x="70" y="75" class="text">Consistent Contributions</text>
  </g>

  <g transform="translate(320,30)">
    <rect class="card" width="260" height="110"/>
    <text x="20" y="45" class="trophy">🚀</text>
    <text x="70" y="45" class="title">Project Builder</text>
    <text x="70" y="75" class="text">Full-Stack Apps</text>
  </g>

  <g transform="translate(600,30)">
    <rect class="card" width="260" height="110"/>
    <text x="20" y="45" class="trophy">🔥</text>
    <text x="70" y="45" class="title">Code Streak</text>
    <text x="70" y="75" class="text">Daily Commits</text>
  </g>
</svg>
